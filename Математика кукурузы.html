:root{--accent:#08764c;--muted:#4b6056;--line:#d7e2da;--pale:#f0f6ef}

.choice{border-color:#a4b7ab;font-size:20px;line-height:1.35;padding:16px 20px;display:flex;align-items:flex-start;gap:16px;counter-increment:answer}
.choice-copy{display:block;min-width:0}

.choice.selected{padding:15px 19px;border-color:var(--accent)}
.choice.selected .choice-badge{background:var(--forest);color:white}
.choice.selected .choice-badge:before{content:'✓'}
.choice.wrong{border:2px solid #984710;padding:15px 19px}
.choice.wrong .choice-badge{background:#984710;color:white}
.choice.wrong .choice-badge:before{content:'!'}

.feedback:empty{visibility:hidden;padding:0;margin:0}

.exercise label{font-size:20px;font-weight:bold;margin-bottom:14px}
.exercise .numberbox{max-width:340px}
.exercise .feedback{background:#fff;padding:14px 16px;font-size:18px}
.exercise .feedback.error{background:#fff7eb}
.example-data{gap:32px;margin:0 0 24px}
.example-data strong{font-size:36px;line-height:1.1;margin-bottom:8px;letter-spacing:-.5px}
.example-data span{font-size:17px;line-height:1.3;display:block}
.leaf-art{display:none}
.bar{height:34px;border-radius:0 12px 0 0;margin-top:18px!important}
.legend{gap:24px;font-size:16px;margin-top:12px}
.key:before{width:12px;height:12px}

.steps{gap:8px;margin:0 0 16px}
.step{height:28px;width:36px;display:grid;place-items:center;background:var(--pale);font-size:15px;font-weight:700;color:var(--forest);counter-increment:waterstep}
.steps{counter-reset:waterstep}
.step:before{content:counter(waterstep)}
.step.on{background:var(--forest);color:#fff}
.steptext{height:142px;min-height:0}
.steptext h3{font-size:22px;margin-bottom:10px}

.compare-result .big{font-size:38px;min-width:250px;letter-spacing:-.8px;white-space:nowrap}
.compare-result p{font-size:18px;line-height:1.35;margin:0}

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=(v,d=0)=>Number(v).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
const num=v=>Number(String(v).replace(/\s/g,'').replace(',','.'));
const round=(value,digits=0)=>Math.round((value+Number.EPSILON)*10**digits)/10**digits;
// Каждый завершённый показатель округляется перед следующим действием.
const standard=(yieldWet,moisture)=>round(yieldWet*(100-moisture)/86,2);
const seedCost=(rate,bag,price)=>round(rate/bag*price);
const dryCost=(mass,moisture,tariff)=>round(Math.max(0,moisture-14)*mass*tariff);
const state={page:0,values:{},answers:{},steps:{},choices:{},completed:{},tab:0};
const head=(n,title,intro='')=>`<div class="eyebrow">${n}</div><h2 class="screen-title">${title}</h2>${intro?`<p class="intro">${intro}</p>`:''}`;
const field=(id,label,value,unit,min,max,step=1)=>`<div class="field"><label for="${id}">${label}</label><div class="numberbox"><input id="${id}" type="number" value="${state.values[id]??value}" min="${min}" max="${max}" step="${step}" inputmode="decimal"><span>${unit}</span></div></div>`;
function storeFields(){ $$('main input:not([data-answer])').forEach(e=>state.values[e.id]=e.value); }
function read(id,min,max){const e=$('#'+id),v=e.value===''?NaN:num(e.value);const valid=Number.isFinite(v)&&v>=min&&v<=max;e.setAttribute('aria-invalid',!valid);return valid?v:null;}
function bindCalc(fn){$$('main input:not([data-answer]):not([type=range])').forEach(e=>e.addEventListener('input',()=>{storeFields();fn();}));fn();}
function invalid(message='Введите числа в допустимом диапазоне.'){ $('#error').textContent=message; }
function resetFields(ids){ids.forEach(id=>delete state.values[id]);render(false);}
function quiz(id,target,tolerance,success,hint,unit){const answer=state.answers[id]??'';return `<div class="exercise"><label for="answer-${id}">Ваш ответ, ${unit}<span class="answer-rounding">${id==='yield'?'Округлите до сотых':'Округлите до целого рубля'}</span></label><div class="numberbox"><input id="answer-${id}" data-answer="${id}" inputmode="decimal" type="text" value="${answer}" autocomplete="off"><span>${unit}</span></div><div class="actions"><button class="btn" id="check">Проверить</button><button class="link" id="hint">Подсказка</button></div><div id="feedback" class="feedback" role="status"></div></div>`;}
function bindQuiz(id,target,tolerance,success,hint){const input=$('#answer-'+id),fb=$('#feedback');const check=()=>{state.answers[id]=input.value;const val=num(input.value);const empty=!input.value.trim();const ok=!empty&&Number.isFinite(val)&&Math.abs(val-target)<=tolerance;fb.className='feedback'+(ok?'':' error');fb.textContent=ok?success:empty?'Введите результат расчёта. Можно использовать запятую или точку.':Number.isFinite(val)?'Пока не сходится. '+hint:'Введите число без единиц измерения. Например: '+fmt(target,target<100?2:0)+'.';};$('#check').onclick=check;input.onkeydown=e=>{if(e.key==='Enter')check();};input.oninput=()=>state.answers[id]=input.value;$('#hint').onclick=()=>{fb.className='feedback';fb.textContent=hint;};}
function bindChoice(id,correct,texts){$$('.choice').forEach((b,i)=>{if(state.choices[id]===i){b.classList.add(i===correct?'selected':'wrong');b.setAttribute('aria-pressed','true');}b.onclick=()=>{state.choices[id]=i;syncGate();$$('.choice').forEach((x,j)=>{x.classList.remove('selected','wrong');x.setAttribute('aria-pressed',j===i?'true':'false');});b.classList.add(i===correct?'selected':'wrong');$('#feedback').className='feedback'+(i===correct?'':' error');$('#feedback').textContent=texts[i];};});if(state.choices[id]!==undefined)$$('.choice')[state.choices[id]].click();}
const pages=[
{section:'Начальный курс',view:()=>`<div class="hero"><div class="eyebrow">Для менеджеров по продажам семян</div><h1>Математика<br>кукурузы</h1><p>Как сравнить гибриды в рублях на гектар<br>и объяснить расчёт клиенту</p><p class="hero-under">Разбирайте примеры, меняйте исходные числа<br>и пробуйте считать самостоятельно.</p><img src="${ART_COVER}" alt="Фирменная композиция из фотографий сельскохозяйственной техники и зелёных геометрических форм из презентации"><div class="hero-line"></div></div>`},
{section:'С чего начинается сравнение',view:()=>head('От урожая к результату','Какой гибрид выгоднее для клиента?','На двух демонстрационных участках по 1 га измерили массу зерна сразу после уборки и его влажность. Достаточно ли этих данных, чтобы выбрать более выгодный гибрид?')+`<div class="diagnostic-data"><div><h3>СИ Талисман</h3><p><strong>8,4</strong> т/га при уборке <span class="moisture-value">Влажность 20%</span></p></div><div><h3>ЛГ 30189</h3><p><strong>8,5</strong> т/га при уборке <span class="moisture-value">Влажность 24%</span></p></div></div><div class="choices"><button class="choice" aria-pressed="false">Выбрать СИ Талисман: зерно суше, значит, расходы на сушку будут ниже.</button><button class="choice" aria-pressed="false">Выбрать ЛГ 30189: масса при уборке выше, значит, выручка будет больше.</button><button class="choice" aria-pressed="false">Пока не выбирать: пересчитать урожайность к 14%, учесть цену зерна и затраты на сушку и семена.</button></div><div class="feedback" id="feedback" role="status"></div>`,bind:()=>bindChoice('diagnostic',2,['Более сухое зерно может снизить затраты на сушку. Для выбора приведём урожайность к 14%, рассчитаем выручку по цене зерна и учтём затраты на сушку и стоимость семян на гектар.','Большая масса при уборке ещё не означает большую выручку: часть массы составляет вода. Для выбора приведём урожайность к 14%, рассчитаем выручку по цене зерна и учтём затраты на сушку и стоимость семян на гектар.','Верно. Сначала приведём массу к одной влажности, затем учтём цену зерна, семена и сушку. Так мы сравним результат в рублях на гектар.'])},
{section:'01 / Влажность',view:()=>head('Сначала смысл','Приводим урожайность к 14%','Мы используем стандартную влажность 14%. К ней приводим урожайность обоих гибридов для сравнения.')+`<div class="cols"><div><div class="eyebrow">Пример: 8,5 т/га при уборке, влажность 28%</div><div class="bar"><span class="dry" style="width:72%"></span></div><div class="legend"><span class="key">Сухое вещество: 72%</span><span class="key water">Вода: 28%</span></div><h3 class="formula-caption">Пересчёт урожайности зерна кукурузы на стандартную влажность</h3><div class="formula formula-line">У<sub>СтВ</sub> = У<sub>УВ</sub> × <span class="math-frac"><span>100 − УВ</span><span>100 − СтВ</span></span></div><p class="formula-legend">У<sub>СтВ</sub> — урожайность при стандартной влажности, т/га.<br>У<sub>УВ</sub> — урожайность при уборочной влажности, т/га.<br>УВ — уборочная влажность, %.<br>СтВ — стандартная влажность: 14%.</p></div><div class="divider"><div class="steps"><span class="step"></span><span class="step"></span><span class="step"></span></div><div id="steptext" class="steptext"></div><div class="result water-result" id="waterResult" hidden><p>Урожайность при стандартной влажности 14%</p><div class="big">7,12 <span class="unit">т/га</span></div></div><div class="actions"><button id="explain" class="btn secondary">Следующий шаг →</button></div></div></div>`,bind:()=>{const texts=['<h3>Пример: исходные данные</h3><p>При уборке получили 8,5 т/га зерна с влажностью 28%. Нам нужна урожайность при стандартной влажности 14%.</p>','<h3>2. Подставляем в формулу</h3><p>Из 100 вычитаем каждую влажность: 100 − 28 = 72 и 100 − 14 = 86. Урожайность при уборке умножаем на отношение 72 к 86.</p><div class="formula formula-line">8,5 × <span class="math-frac"><span>100 − 28</span><span>100 − 14</span></span> = 8,5 × <span class="math-frac"><span>72</span><span>86</span></span></div>','<h3>3. Получаем результат</h3><p>8,5 × 72 ÷ 86 ≈ 7,12 т/га. Округляем до сотых: это значение используем в дальнейших расчётах.</p>'];let i=state.steps.water??0;const show=()=>{$('#steptext').innerHTML=texts[i];$('#waterResult').hidden=i!==2;$$('.step').forEach((e,j)=>e.classList.toggle('on',j<=i));$('#explain').textContent=i===2?'Повторить шаги ↺':'Следующий шаг →';state.steps.water=i;if(i===2)state.completed.water=true;syncGate();applyTypeStyles();};$('#explain').onclick=()=>{i=(i+1)%3;show();};show();}},
{section:'01 / Влажность',view:()=>head('Попробуйте изменить числа','Урожайность при влажности 14%','Меняйте уборочную влажность и наблюдайте: при одинаковой исходной массе более влажное зерно даёт меньше массы после пересчёта.')+`<div class="cols"><div><div class="fields two"><p class="fixed-yield">Урожайность при уборке<br><strong>8,5 т/га</strong></p>${field('moisture','Уборочная влажность',28,'%',14,40,.1)}</div><label class="sr" for="moistureRange">Изменить уборочную влажность ползунком</label><input id="moistureRange" type="range" min="14" max="40" step="0.1" value="${state.values.moisture??28}"><div class="rangeends"><span>14%</span><span>40%</span></div><div id="error" class="invalid" role="status"></div><div class="note">Более влажное зерно содержит больше воды. Пересчёт позволяет сравнить урожайность гибридов при одинаковой влажности.</div><button class="link" id="reset">Сбросить</button></div><div class="divider"><div class="result dark" aria-live="polite"><div class="eyebrow">Сопоставимая урожайность</div><div class="big"><span id="yieldResult"></span> <span class="unit">т/га</span></div><p id="yieldSub"></p></div><div class="substitution" id="yieldWork"></div><div class="note">Это пересчёт массы на другую влажность. Урожайность округляем до сотых и используем дальше.</div></div></div>`,bind:()=>{const calc=()=>{const y=8.5,m=read('moisture',14,40);if(y===null||m===null){invalid('Влажность: 14–40%.');$('#yieldResult').textContent='—';$('#yieldSub').textContent='Проверьте исходные числа';$('#yieldWork').textContent='';return;}invalid('');$('#moistureRange').value=m;const r=standard(y,m);$('#yieldResult').textContent=fmt(r,2);$('#yieldSub').textContent=`При пересчёте масса уменьшается на ${fmt(y-r,2)} т/га.`;$('#yieldWork').textContent=`${fmt(y,1)} × (100 − ${fmt(m,1)}) ÷ 86 ≈ ${fmt(r,2)} т/га`;};bindCalc(calc);$('#moistureRange').oninput=()=>{$('#moisture').value=$('#moistureRange').value;storeFields();calc();};$('#reset').onclick=()=>resetFields(['wetYield','moisture','moistureRange']);}},
{section:'01 / Практика',view:()=>head('Небольшая тренировка','Пересчитайте урожайность','В хозяйстве получили 8,5 т/га кукурузы при влажности 25%. Какая урожайность получится при влажности 14%?')+`<div class="cols"><div><div class="example-data"><div><strong>8,5</strong><span>т/га при уборке</span></div><div><strong>25%</strong><span>уборочная влажность</span></div><div><strong>14%</strong><span>стандартная влажность</span></div></div><div class="formula formula-line">У<sub>СтВ</sub> = У<sub>УВ</sub> × <span class="math-frac"><span>100 − УВ</span><span>100 − СтВ</span></span></div><p class="formula-legend">У<sub>СтВ</sub> — урожайность при стандартной влажности, т/га.<br>У<sub>УВ</sub> — урожайность при уборочной влажности, т/га.<br>УВ — уборочная влажность, %.<br>СтВ — стандартная влажность: 14%.</p></div><div class="divider">${quiz('yield',7.41,.0051,'','', 'т/га')}</div></div>`,bind:()=>bindQuiz('yield',7.41,.0051,'Верно: 7,41 т/га. При сравнении гибридов используйте урожайность при одной и той же влажности.','Сначала 100 − 25 = 75 и 100 − 14 = 86. Затем 8,5 × 75 ÷ 86.')},
{section:'02 / Семена',view:()=>head('Одна база для сравнения','Цена мешка ещё не говорит о цене семян','В посевной единице (п.е.) может быть 50, 70 или 80 тыс. семян. Приведём цены двух мешков к одинаковому количеству: 80 тыс. семян.')+`<div class="cols"><div><div class="formula formula-line">Цена 80 тыс. = <span class="math-frac"><span>СС × 80</span><span>Размерность мешка</span></span></div><p class="formula-legend">СС — стоимость семян, руб./п.е.<br>Размерность мешка — количество семян в п.е., тыс. семян.</p><p class="small muted">Распространённые размеры мешков семян:<br>50 тыс. — КВС, Лимагрен, РАЖТ, МАС Сидс, Лабуле.<br>70 тыс. — Вудсток, некоторые гибриды РосАгроТрейд.<br>80 тыс. — Сингента, Байер, Лидеа, Кортева.<br>Проверяйте фактическую упаковку.</p></div><div class="divider"><h3>Выберите пример</h3><div class="tabs" role="tablist" aria-label="Два примера пересчёта цены"><button class="tab" role="tab" aria-selected="true" id="bag50">50 тыс.<br>10 000 руб.</button><button class="tab" role="tab" aria-selected="false" id="bag70">70 тыс.<br>12 000 руб.</button></div><div class="result dark" role="tabpanel" aria-live="polite" id="bagPanel"><div class="eyebrow">Эквивалент 80 тыс. семян</div><div class="big"><span id="bagResult"></span> <span class="unit">руб.</span></div><p id="bagWork"></p></div><p class="small muted rounding-note">Цену округляем до целого рубля. Далее используем округлённое значение.</p></div></div>`,bind:()=>{const show=size=>{const price=size===50?10000:12000,result=round(price*80/size);state.steps.bag=size;$('#bagResult').textContent=fmt(result);$('#bagWork').textContent=fmt(price)+' × 80 ÷ '+size+' ≈ '+fmt(result)+' руб.';[50,70].forEach(v=>$('#bag'+v).setAttribute('aria-selected',v===size));$('#bagPanel').setAttribute('aria-labelledby','bag'+size);applyTypeStyles();bindShortWords();};[50,70].forEach(v=>$('#bag'+v).onclick=()=>show(v));show(state.steps.bag??50);}},
{section:'02 / Семена',view:()=>head('Расходы на гектар','Сколько стоят семена для одного гектара','Норму высева разделим на количество семян в мешке и умножим на цену мешка.')+`<div class="cols"><div><div class="formula formula-line">Затраты на 1 га = <span class="math-frac"><span>НВ</span><span>Размерность мешка</span></span> × Стоимость 1 п.е.</div><p class="formula-legend">НВ — норма высева, тыс. семян/га.<br>Размерность мешка — количество семян в 1 п.е., тыс. семян.<br>Стоимость 1 п.е. — цена мешка, руб.</p><div class="note">Если требуется дополнительная обработка семян, прибавьте её стоимость в расчёте на гектар.</div></div><div class="divider"><h3>Пример:</h3><div class="fields two">${field('seedRate','Норма высева',68,'тыс./га',20,120,1)}${field('seedBag','Семян в одной п.е.',80,'тыс. шт.',10,150,1)}${field('seedPrice','Цена одной п.е.',16000,'руб.',1,100000,100)}</div><div id="error" class="invalid" role="status"></div><div class="result dark" aria-live="polite"><div class="eyebrow">Затраты на семена</div><div class="big"><span id="seedResult"></span> <span class="unit">руб./га</span></div><p id="seedWork"></p></div><button id="reset" class="link">Сбросить</button></div></div>`,bind:()=>{const calc=()=>{const r=read('seedRate',20,120),b=read('seedBag',10,150),p=read('seedPrice',1,100000);if(r===null||b===null||p===null){invalid('Норма: 20–120 тыс./га. Размер п.е.: 10–150 тыс. Цена: 1–100 000 руб.');$('#seedResult').textContent='—';$('#seedWork').textContent='';return;}invalid('');$('#seedResult').textContent=fmt(seedCost(r,b,p));$('#seedWork').textContent=fmt(r)+' ÷ '+fmt(b)+' × '+fmt(p)+' ≈ '+fmt(seedCost(r,b,p))+' руб./га';};bindCalc(calc);$('#reset').onclick=()=>resetFields(['seedRate','seedBag','seedPrice']);}},
{section:'02 / Практика',view:()=>head('Небольшая тренировка','Рассчитайте затраты на семена','Норма высева — 75 тыс. семян/га, размерность мешка — 80 тыс. семян. Одна п.е. стоит 17 000 руб., отдельной платы за обработку нет. Рассчитайте затраты на 1 га.')+`<div class="formula formula-line wide-formula">Затраты на 1 га = <span class="math-frac"><span>НВ</span><span>Размерность мешка</span></span> × Стоимость 1 п.е.</div><p class="formula-legend">НВ — норма высева, тыс. семян/га.<br>Размерность мешка — количество семян в 1 п.е., тыс. семян.<br>Стоимость 1 п.е. — цена мешка, руб.</p><div class="wide-practice">${quiz('seed',15938,.01,'','','руб./га')}</div>`,bind:()=>bindQuiz('seed',15938,.01,'Верно: 15 938 руб./га после округления. Расчёт: 75 ÷ 80 × 17 000 = 15 937,50 руб./га.','Сначала найдите долю п.е. на гектар: 75 ÷ 80. Умножьте на 17 000 и округлите итог до целого рубля.')},
{section:'03 / Сушка',view:()=>head('Где возникает расход','Кто сушит зерно и как учитывает оплату','Затраты на сушку могут составлять значительную часть общих затрат. Выберите способ сушки и посмотрите, что уточнить у клиента.')+`<div class="tabs" role="tablist" aria-label="Способы сушки"><button id="own" class="tab" role="tab" aria-selected="true">Сушилка хозяйства</button><button id="elevator" class="tab" role="tab" aria-selected="false">Сушка на элеваторе</button></div><div id="mode"></div>`,bind:()=>{const show=()=>{$('#own').setAttribute('aria-selected',state.tab===0);$('#elevator').setAttribute('aria-selected',state.tab===1);$('#mode').innerHTML=state.tab===0?`<div class="process"><div><b>01</b>Зерно после уборки</div><span aria-hidden="true">→</span><div><b>02</b>Сушка в хозяйстве</div><span aria-hidden="true">→</span><div><b>03</b>Продажа высушенного зерна</div></div><div class="cols" style="margin-top:20px"><div><h3>Считаем сушку отдельно</h3><p>Из выручки за зерно при 14% вычитаем расходы хозяйства на сушку.</p></div><div class="divider"><h3>Что спросить у клиента</h3><p>«Во сколько вам обходится снижение влажности одной тонны на один процентный пункт?»</p></div></div>`:`<div class="process"><div><b>01</b>Зерно после уборки</div><span aria-hidden="true">→</span><div><b>02</b>Приёмка и сушка элеватором</div><span aria-hidden="true">→</span><div><b>03</b>Расчёт с учётом условий приёмки</div></div><div class="cols" style="margin-top:20px"><div><h3>Уточняем условия расчёта</h3><p>Тариф на сушку, исходную и конечную влажность, учёт затрат на сушку в итоговой стоимости зерна.</p></div><div class="divider"><h3>Что спросить у клиента</h3><p>«Сколько стоит снижение влажности одной тонны зерна на один процентный пункт? Как затраты на сушку учитываются в итоговой стоимости зерна?»</p></div></div>`;};$('#own').onclick=()=>{state.tab=0;show();applyTypeStyles();};$('#elevator').onclick=()=>{state.tab=1;show();applyTypeStyles();};show();}},
{section:'03 / Сушка',view:()=>head('Попробуйте изменить числа','Стоимость сушки в тонно-процентах','Один тонно-процент (т-%) — снижение влажности одной тонны зерна на один процентный пункт. С 20% до 14% нужно снять 6 пунктов.')+`<div class="cols"><div><div class="fields two">${field('dryMass','Масса зерна при уборке',100,'т',.1,10000,.1)}${field('dryMoist','Уборочная влажность',20,'%',14,40,.1)}${field('dryTariff','Тариф на сушку за один т-%',300,'руб.',1,3000,10)}</div><div id="error" class="invalid" role="status"></div><div class="formula formula-line">Затраты на сушку = (УВ − 14) × Масса × С<sub>СУШ</sub></div><p class="formula-legend">УВ — уборочная влажность, %.<br>Масса — зерно при уборке, т.<br>С<sub>СУШ</sub> — тариф на сушку, руб./т-%. Сушим до 14%.</p><button class="link" id="reset">Сбросить</button></div><div class="divider"><div class="result dark" aria-live="polite"><div class="eyebrow">Затраты на всю партию</div><div class="big" style="font-size:55px"><span id="dryResult"></span> <span class="unit">руб.</span></div><p id="dryWork"></p></div><div class="note" style="font-size:15px;margin-top:12px">При высокой влажности (26–30%) может потребоваться сушка в два прохода. Поэтому уточняйте тариф на сушку.</div></div></div>`,bind:()=>{const calc=()=>{const m=read('dryMass',.1,10000),w=read('dryMoist',14,40),t=read('dryTariff',1,3000);if(m===null||w===null||t===null){invalid('Масса: 0,1–10 000 т. Влажность: 14–40%. Тариф: 1–3 000 руб.');$('#dryResult').textContent='—';$('#dryWork').textContent='';return;}invalid('');$('#dryResult').textContent=fmt(dryCost(m,w,t));$('#dryWork').textContent=`(${fmt(w,1)} − 14) × ${fmt(m,1)} × ${fmt(t)} = ${fmt(dryCost(m,w,t))} руб.`;};bindCalc(calc);$('#reset').onclick=()=>resetFields(['dryMass','dryMoist','dryTariff']);}},
{section:'03 / Сравнение гибридов',view:()=>head('Возвращаемся к демо-участкам','СИ Талисман и ЛГ 30189','Каждый участок — 1 га. Сушка стоит 350 руб./т-%, цена зерна при влажности 14% — 9 000 руб./т. Раскройте расчёт по шагам.')+`<div class="cols" style="grid-template-columns:780px 1fr;gap:32px;margin-top:22px"><div><table><thead><tr><th>Показатель на 1 га</th><th>СИ Талисман</th><th>ЛГ 30189</th></tr></thead><tbody><tr><td>Масса при уборке, т</td><td>8,4</td><td>8,5</td></tr><tr><td>Уборочная влажность</td><td>20%</td><td>24%</td></tr><tr class="reveal-row" data-stage="1"><td>Урожайность при 14%, т/га</td><td>7,81</td><td>7,51</td></tr><tr class="reveal-row" data-stage="2"><td>Сушка, руб./га</td><td>17 640</td><td>29 750</td></tr><tr class="reveal-row" data-stage="3"><td>Выручка, руб./га</td><td>70 290</td><td>67 590</td></tr><tr class="total reveal-row" data-stage="3"><td>Выручка минус сушка, руб./га</td><td>52 650</td><td>37 840</td></tr></tbody></table><div class="compare-result reveal-row" data-stage="3"><div class="big">+14 810 <span class="unit">руб./га</span></div><p>В пользу СИ Талисман при условиях этого примера</p></div><p class="small muted" style="margin-top:10px">Урожайность округляем до сотых и используем дальше. Денежные показатели — до целого рубля. Это результат после оплаты сушки, без вычета семян и остальных расходов.</p></div><div><div class="eyebrow" id="compareStep"></div><p id="compareText" style="font-size:20px;min-height:210px"></p><button id="reveal" class="btn secondary">Раскрыть следующий шаг</button></div></div>`,bind:()=>{let stage=state.steps.compare??0;const names=['Сначала исходные данные','Шаг 1 / Сопоставимая масса','Шаг 2 / Затраты на сушку','Шаг 3 / Денежный результат'];const texts=['У ЛГ 30189 выше масса при уборке. Но выше и влажность. Пока не выбираем по одному показателю.','8,4 × 80 ÷ 86 ≈ 7,81 т/га.\n\n8,5 × 76 ÷ 86 ≈ 7,51 т/га.\n\nПри одинаковой влажности у СИ Талисман больше зерна.','Для СИ Талисман снимаем 6 пунктов: 6 × 8,4 × 350 = 17 640 руб./га.\n\nДля ЛГ 30189 — 10 пунктов: 10 × 8,5 × 350 = 29 750 руб./га.','Используем округлённую урожайность:\n7,81 × 9 000 − 17 640 = 52 650 руб./га.\n7,51 × 9 000 − 29 750 = 37 840 руб./га.\n\nПреимущество складывается из большей сопоставимой массы и меньших расходов на сушку.'];const show=()=>{$$('.reveal-row').forEach(r=>{const shown=Number(r.dataset.stage)<=stage;r.classList.toggle('shown',shown);r.style.visibility=shown?'visible':'hidden';});$('#compareStep').textContent=names[stage];$('#compareText').textContent=texts[stage];$('#compareText').style.whiteSpace='pre-line';$('#reveal').textContent=stage===3?'Повторить расчёт ↺':'Раскрыть следующий шаг';bindShortWords();state.steps.compare=stage;if(stage===3)state.completed.compare=true;syncGate();};$('#reveal').onclick=()=>{stage=(stage+1)%4;show();};show();}},
{section:'03 / Практика',view:()=>head('Объясните клиенту','Почему 8,4 т могут оказаться выгоднее 8,5 т?','Клиент смотрит только на массу при уборке: «У конкурента 8,5 тонны, значит, он лучше». Как ответить на основе разобранного расчёта?')+`<div class="choices"><button class="choice" aria-pressed="false">«У СИ Талисман ниже влажность. Значит, он всегда выгоднее любого другого гибрида».</button><button class="choice" aria-pressed="false">«Приведём урожайность к 14% и рассчитаем выручку и сушку. Здесь результат выше у СИ Талисман; для окончательного сравнения учтём семена и остальные расходы».</button><button class="choice" aria-pressed="false">«Нужно вычесть из каждой урожайности её процент влажности и сравнить остаток».</button></div><div class="feedback" id="feedback" role="status"></div>`,bind:()=>bindChoice('talk',1,['Здесь слишком широкий вывод. Влажность влияет на расчёт, но результат также зависит от урожайности, тарифа сушки, цены зерна и других затрат.','Верно. Вы называете способ сравнения и ограничиваете вывод условиями примера. Преимущество после сушки — 14 810 руб./га. Для окончательного сравнения добавим семена и остальные расходы.','Процент влажности нельзя напрямую вычитать из тонн. Используйте пересчёт по доле сухого вещества: масса × (100 − влажность) ÷ 86.'])},
{section:'04 / Общий расчёт',view:()=>head('Все элементы вместе','Сравнение в рублях на гектар','Изменяйте значения в белых полях: весь расчёт обновляется сразу.')+`<div class="final-table-layout"><div><table class="compact"><thead><tr><th>Показатель</th><th>Гибрид Сингента</th><th>Гибрид Конкурент</th></tr></thead><tbody><tr><td>Уборочная влажность, %</td><td>${field('aM','Влажность Сингента',20,'',14,40,.1)}</td><td>${field('bM','Влажность Конкурент',23,'',14,40,.1)}</td></tr><tr><td>Урожайность при уборке, т/га</td><td>${field('aY','Урожайность Сингента',9,'',.1,30,.1)}</td><td>${field('bY','Урожайность Конкурент',9,'',.1,30,.1)}</td></tr><tr><td>Цена п.е. (80 тыс. семян), руб.</td><td>${field('aP','Цена п.е. Сингента',17000,'',1,100000,100)}</td><td>${field('bP','Цена п.е. Конкурент',16000,'',1,100000,100)}</td></tr><tr><td>Норма высева, тыс./га</td><td>${field('aN','Норма высева Сингента',75,'',20,120,1)}</td><td>${field('bN','Норма высева Конкурент',75,'',20,120,1)}</td></tr><tr><td>Урожайность при 14%, т/га</td><td id="aStd"></td><td id="bStd"></td></tr><tr><td>Семена, руб./га</td><td id="aSeed"></td><td id="bSeed"></td></tr><tr><td>Сушка, руб./га</td><td id="aDry"></td><td id="bDry"></td></tr><tr><td>Выручка, руб./га</td><td id="aRev"></td><td id="bRev"></td></tr><tr class="total"><td>Выручка − семена − сушка, руб./га</td><td id="aNet"></td><td id="bNet"></td></tr></tbody></table><div class="compare-result" aria-live="polite"><div class="big" id="advantage"></div><p id="advantageText"></p></div></div><aside class="final-aside"><div class="eyebrow">Общие условия</div><div class="fields">${field('grainPrice','Цена зерна при 14%',9000,'руб./т',1,50000,100)}${field('tariff','Тариф на сушку за один т-%',300,'руб.',1,3000,10)}</div><button id="reset" class="link" style="margin:10px 0">Сбросить</button><p class="small">Учтены семена и сушка. Прочие затраты не включены.</p><p class="small">Округляем т/га до сотых, рубли — до целых. Эти значения используем дальше.</p><div id="error" class="invalid" role="status" style="font-size:14px"></div></aside></div>`,bind:()=>{const calc=()=>{const price=read('grainPrice',1,50000),t=read('tariff',1,3000);const data=['a','b'].map(k=>({k,m:read(k+'M',14,40),y:read(k+'Y',.1,30),p:read(k+'P',1,100000),n:read(k+'N',20,120)}));if(price===null||t===null||data.some(d=>Object.values(d).includes(null))){invalid('Проверьте выделенные поля. Допустимые значения указаны в подсказках к полям.');['a','b'].forEach(k=>['Std','Seed','Dry','Rev','Net'].forEach(s=>$('#'+k+s).textContent='—'));$('#advantage').textContent='—';$('#advantageText').textContent='Проверьте исходные числа';return;}invalid('');const results=data.map(d=>{const std=standard(d.y,d.m),seed=seedCost(d.n,80,d.p),dry=dryCost(d.y,d.m,t),rev=round(std*price),net=rev-seed-dry;Object.entries({Std:std,Seed:seed,Dry:dry,Rev:rev,Net:net}).forEach(([s,v])=>$('#'+d.k+s).textContent=fmt(v,s==='Std'?2:0));return net;});const delta=results[0]-results[1];$('#advantage').innerHTML=`${fmt(Math.abs(delta))} <span class="unit" data-type="note">руб./га</span>`;$('#advantageText').textContent=Math.abs(delta)<.5?'При этих условиях результаты равны с точностью до рубля.':`Преимущество ${delta>0?'гибрида Сингента':'гибрида Конкурент'} при заданных условиях`;};$$('table .field label').forEach(l=>l.classList.add('sr'));bindCalc(calc);$('#reset').onclick=()=>resetFields(['aM','bM','aY','bY','aP','bP','aN','bN','grainPrice','tariff']);}},
{section:'04 / Переговоры',view:()=>head('Аргумент на основе расчёта','«Ваши семена дороже. Зачем переплачивать?»','Используем исходные условия итоговой таблицы: одинаковая урожайность при уборке 9 т/га, влажность 20% и 23%. Выберите точный ответ.')+`<div class="choices"><button class="choice" aria-pressed="false">«Более дорогие семена гарантируют большую прибыль, поэтому сравнивать цену не нужно».</button><button class="choice" aria-pressed="false">«Разница в цене мешка всего 1 000 рублей. На таком масштабе это несущественно».</button><button class="choice" aria-pressed="false">«Семена дороже на 938 руб./га. Но при этих данных выручка выше, а сушка дешевле. После вычета семян и сушки разница составляет 9 952 руб./га в нашу пользу».</button></div><div id="feedback" class="feedback" role="status"></div>`,bind:()=>bindChoice('negotiation',2,['Расчёт не даёт гарантии результата в любом хозяйстве. Обсуждайте конкретные исходные данные и учитываемые расходы.','Переведите стоимость семян в рубли на гектар. Сопоставьте выручку, затраты на семена и сушку; уточните различия в остальных расходах.','Верно. Доплата за семена: 938 руб./га. Прибавка выручки: 2 790 руб./га. Экономия на сушке: 8 100 руб./га. Итого: 2 790 + 8 100 − 938 = 9 952 руб./га.'])},
{section:'Нажмите «Следующий урок» выше для прохождения теста',view:()=>head('Памятка для переговоров','Как сравнить гибриды с клиентом')+`<div class="summary"><article><h3>1. Урожайность: одна влажность</h3><p class="formula">У<sub>СтВ</sub> = У<sub>УВ</sub> × <span class="math-frac"><span>100 − УВ</span><span>100 − СтВ</span></span></p><p class="small muted summary-legend">У<sub>СтВ</sub> — урожайность при стандартной влажности, т/га.<br>У<sub>УВ</sub> — урожайность при уборочной влажности, т/га.<br>УВ — уборочная влажность, %.<br>СтВ — стандартная влажность: здесь 14%.</p></article><article><h3>2. Семена: рубли на гектар</h3><p class="formula">ЗНС = <span class="math-frac"><span>НВ</span><span>Размерность мешка</span></span> × Стоимость 1 п.е.</p><p class="small muted summary-legend">ЗНС — затраты на семена, руб./га.<br>НВ — норма высева, тыс. семян/га.<br>Размерность мешка — семян в 1 п.е., тыс. шт.<br>Стоимость 1 п.е. — цена посевной единицы, руб.</p><p class="small muted agriclaim-note">Агриклайм влияет на стоимость семян.</p></article><article><h3>3. Сушка: тариф и способ оплаты</h3><p class="formula">З<sub>СУШ</sub> = (УВ − 14) × С<sub>СУШ</sub> × У<sub>УВ</sub></p><p class="small muted summary-legend">З<sub>СУШ</sub> — затраты на сушку, руб./га.<br>УВ — уборочная влажность, %.<br>14 — стандартная влажность, %.<br>С<sub>СУШ</sub> — тариф на сушку, руб./т-%.<br>У<sub>УВ</sub> — урожайность при уборочной влажности, т/га.</p></article><article><h3>4. Итог: разница на гектар</h3><p class="formula">Д = В − ЗНС − З<sub>СУШ</sub>; В = СЗ × У<sub>СтВ</sub></p><p class="small muted summary-legend">Д — доход после вычета семян и сушки, руб./га.<br>В — выручка, руб./га.<br>ЗНС — затраты на семена, руб./га.<br>З<sub>СУШ</sub> — затраты на сушку, руб./га.<br>СЗ — цена зерна, руб./т.<br>У<sub>СтВ</sub> — урожайность при стандартной влажности, т/га.</p></article></div><div class="note summary-note">Урожайность округляйте до сотых, рубли — до целых. Для полной прибыли учтите остальные расходы.</div>`,bind:()=>{}}
];

function enhanceVisuals(){
  $$('.choices .choice').forEach(button=>{
    const copy=document.createElement('span');copy.className='choice-copy';
    while(button.firstChild)copy.appendChild(button.firstChild);
    const badge=document.createElement('span');badge.className='choice-badge';badge.setAttribute('aria-hidden','true');
    button.append(badge,copy);
  });
  $$('main input[type=number]').forEach(input=>{
    input.title=`Допустимые значения: ${input.min}–${input.max}`;
    if($('#error'))input.setAttribute('aria-describedby','error');
  });
  $$('table th').forEach(cell=>cell.setAttribute('scope','col'));
  $$('.steps').forEach(steps=>steps.setAttribute('aria-hidden','true'));
  const diagnostic=$('#notyet');
  if(diagnostic){
    diagnostic.setAttribute('aria-pressed','false');
    diagnostic.addEventListener('click',()=>{
      $$('.choose-two .choice').forEach(b=>b.setAttribute('aria-pressed','false'));
      diagnostic.setAttribute('aria-pressed','true');
    });
    $$('.choose-two .choice').forEach(b=>b.addEventListener('click',()=>diagnostic.setAttribute('aria-pressed','false')));
  }
}


function canAdvance(){
  return !(state.page===1&&state.choices.diagnostic===undefined || state.page===2&&!state.completed.water || state.page===10&&!state.completed.compare);
}
function syncGate(){
  const locked=!canAdvance(),next=$('#next'),hint=$('#gateHint');
  next.disabled=locked;const stepButton=$(state.page===2?'#explain':'#reveal');if(stepButton)stepButton.classList.toggle('step-attention',locked);
  if(locked){
    hint.textContent=state.page===1?'':state.page===2?'Откройте все 3 шага объяснения':'Раскройте все 3 шага расчёта';
    if(state.page===1){next.removeAttribute('aria-describedby');next.removeAttribute('title');}else{next.setAttribute('aria-describedby','gateHint');next.title=hint.textContent;}
  }else{
    hint.textContent=(state.page===2||state.page===10)?'Все шаги открыты. Можно продолжить.':'';
    next.removeAttribute('aria-describedby');next.removeAttribute('title');
  }
}
function alignTextOptically(){
  const canvas=document.createElement('canvas'),context=canvas.getContext('2d');
  if(!context)return;
  $$('main>.eyebrow,main>h2,main>.intro,.hero>.eyebrow,.hero>h1,.hero>p').forEach(element=>{
    const style=getComputedStyle(element),first=element.textContent.trim()[0];
    if(!first)return;
    context.font=`${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
    const left=context.measureText(first).actualBoundingBoxLeft;
    element.style.translate=`${Number.isFinite(left)?left:0}px 0`;
  });
}


function applyTypeStyles(){
  $$('#course *').forEach(e=>{
    ['font','font-size','font-family','font-weight','font-style','line-height','letter-spacing','color'].forEach(p=>e.style.removeProperty(p));
    e.removeAttribute('data-type');
  });
  const roles={
    body:'p,.intro,.substitution,.choice,.formula,.steptext p,.process>div,.feedback,.numberbox input',
    note:'.answer-rounding,.small,small,.muted,.formula-legend,.field label,.numberbox span,.rangeends,.legend,.legend span,.hero-under,.counter,.section,.gate-hint,.inline-hint,.fixed-label,.final-aside p,td,.summary .formula,.summary p,.result p,.compare-result p,.note,.link,.footer-hint,.unit,.invalid,sub',
    label:'.eyebrow,h3,.brand,.btn,.tab,th,tr.total td,.practice-tag,.choice-badge,.step,.process b,.exercise>label',
    heading:'.screen-title,.big,.choose-two .choice strong,.example-data strong,.diagnostic-data strong',
    display:'.hero h1'
  };
  Object.entries(roles).forEach(([role,selector])=>$$(selector).forEach(e=>e.dataset.type=role));
  // Nested status and unit spans inherit the semantic typography of their group.
  $$('.hero>p:not(.hero-under)').forEach(e=>e.dataset.type='body');
}


const shortWordPattern='(?:без|для|при|про|над|под|перед|через|между|около|после|во|ко|со|из|обо|об|от|до|по|за|на|не|ни|но|или|либо|да|и|а|в|к|с|у|о)';
function bindShortWords(){
  const walker=document.createTreeWalker($('#course'),NodeFilter.SHOW_TEXT),nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);
  const pattern=new RegExp('(^|[\\s(«„“])('+shortWordPattern+')[ \\t]+(?=\\S)','giu');
  nodes.forEach(node=>{
    if(node.parentElement?.closest('script,style,textarea'))return;
    let value=node.nodeValue.replace(/(\d)[ \t](?=\d{3}(?:\D|$))/g,'$1\u00a0').replace(/(\d)[ \t\u00a0]*%/g,'$1%');
    for(let i=0;i<3;i++)value=value.replace(pattern,'$1$2\u00a0');
    if(value!==node.nodeValue)node.nodeValue=value;
  });
}


// Short local cue only when entering screen 15. It never loops with the pulse.
const nextLessonCue = (() => {
  let audio = null, previousPage = -1, pending = false;
  function play() {
    if (!pending || previousPage !== 14) return;

function render(focus=true){const p=pages[state.page];$('#course').className='screen-'+state.page+(state.page===0?' cover':'');$('#sectionName').textContent=p.section;$('#screen').innerHTML=p.view();$('#counter').textContent=String(state.page+1).padStart(2,'0')+' / '+pages.length;$('#prev').disabled=state.page===0;$('#next').hidden=state.page===pages.length-1;$('#next').textContent=state.page===0?'Начать →':'Далее →';$('#progress').style.width=(state.page+1)/pages.length*100+'%';p.bind?.();enhanceVisuals();syncGate();applyTypeStyles();bindShortWords();alignTextOptically();$('#live').textContent=`Экран ${state.page+1} из ${pages.length}. ${p.section}`;if(focus)$('#screen').focus({preventScroll:true});nextLessonCue.update(state.page);}
function go(i){if(i>state.page&&!canAdvance())return;storeFields();state.page=Math.max(0,Math.min(pages.length-1,i));render();}
$('#prev').onclick=()=>go(state.page-1);$('#next').onclick=()=>go(state.page+1);
document.addEventListener('keydown',e=>{if(e.target.closest('input,button,[role=tab]')||e.ctrlKey||e.altKey||e.metaKey)return;if(e.key==='ArrowRight'){e.preventDefault();go(state.page+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(state.page-1);}});
function fit(){const scale=Math.min(innerWidth/1280,innerHeight/720);$('#viewport').style.width=1280*scale+'px';$('#viewport').style.height=720*scale+'px';$('#course').style.transform=`scale(${scale})`;}
window.addEventListener('resize',fit);fit();render(false);
